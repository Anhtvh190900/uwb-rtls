<title>Bộ chọn node track</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
  :root{
    --paper:#eceeec; --surface:#f7f8f7; --surface-2:#e3e6e4; --line:#c8cecb;
    --ink:#161d1c; --ink-2:#4b5654; --ink-3:#77817f;
    --road:#1d2624; --divider:#b1811b; --lane:#93a7b8;
    --accent:#0d7a86; --accent-soft:#0d7a8622; --warn:#b4432c;
    --shadow:0 1px 2px #161d1c14, 0 8px 24px #161d1c0f;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#101514; --surface:#171e1d; --surface-2:#1f2726; --line:#303a38;
      --ink:#e7ecea; --ink-2:#a3aeac; --ink-3:#77827f;
      --road:#e9efed; --divider:#e0a93a; --lane:#566a78;
      --accent:#3fc3cf; --accent-soft:#3fc3cf22; --warn:#ef7a5e;
      --shadow:0 1px 2px #0006, 0 8px 24px #0004;
    }
  }
  :root[data-theme="dark"]{
    --paper:#101514; --surface:#171e1d; --surface-2:#1f2726; --line:#303a38;
    --ink:#e7ecea; --ink-2:#a3aeac; --ink-3:#77827f;
    --road:#e9efed; --divider:#e0a93a; --lane:#566a78;
    --accent:#3fc3cf; --accent-soft:#3fc3cf22; --warn:#ef7a5e;
    --shadow:0 1px 2px #0006, 0 8px 24px #0004;
  }

  *{box-sizing:border-box}
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font-family:"IBM Plex Sans",system-ui,sans-serif; font-size:14px;
  }
  .wrap{display:flex; flex-direction:column; min-height:100vh; padding:12px 16px 16px; gap:12px}

  header{display:flex; flex-wrap:wrap; align-items:baseline; gap:8px 16px}
  h1{margin:0; font-size:17px; font-weight:600; letter-spacing:-.01em}
  .sub{font-family:"IBM Plex Mono",ui-monospace,monospace; font-size:12px; color:var(--ink-2)}
  .spacer{flex:1 1 auto}

  .toolbar{display:flex; flex-wrap:wrap; gap:6px; align-items:center}
  button, .chk{
    font:inherit; font-size:12.5px; color:var(--ink); background:var(--surface);
    border:1px solid var(--line); border-radius:6px; padding:5px 10px; cursor:pointer;
  }
  button:hover,.chk:hover{background:var(--surface-2)}
  button:active{transform:translateY(1px)}
  button:focus-visible,.chk:focus-within,input:focus-visible{outline:2px solid var(--accent); outline-offset:1px}
  .chk{display:inline-flex; align-items:center; gap:6px; user-select:none}
  .chk input{accent-color:var(--accent); margin:0}
  button.primary{background:var(--accent); border-color:var(--accent); color:#fff}
  button.primary:hover{filter:brightness(1.08)}
  button.ghost{background:transparent}

  .main{display:flex; gap:12px; align-items:stretch; flex:1 1 auto; min-height:0}
  .stage{
    position:relative; flex:1 1 auto; min-width:0; min-height:62vh;
    background:var(--surface); border:1px solid var(--line); border-radius:10px;
    box-shadow:var(--shadow); overflow:hidden;
  }
  canvas{display:block; width:100%; height:100%; cursor:crosshair; touch-action:none}
  .readout{
    position:absolute; left:10px; bottom:10px; pointer-events:none;
    font-family:"IBM Plex Mono",ui-monospace,monospace; font-size:11.5px; color:var(--ink-2);
    background:color-mix(in srgb, var(--surface) 86%, transparent);
    border:1px solid var(--line); border-radius:5px; padding:3px 7px;
  }
  .tip{
    position:absolute; pointer-events:none; z-index:3; display:none;
    font-family:"IBM Plex Mono",ui-monospace,monospace; font-size:11.5px; line-height:1.5;
    background:var(--surface); color:var(--ink); border:1px solid var(--line);
    border-left:3px solid var(--accent); border-radius:5px; padding:5px 8px; box-shadow:var(--shadow);
    white-space:nowrap;
  }
  .tip b{font-weight:600}
  .tip .dim{color:var(--ink-3)}

  .rail{
    flex:0 0 288px; display:flex; flex-direction:column; gap:10px;
    background:var(--surface); border:1px solid var(--line); border-radius:10px;
    box-shadow:var(--shadow); padding:12px; min-height:0;
  }
  .rail h2{
    margin:0; font-size:11px; font-weight:600; letter-spacing:.08em; text-transform:uppercase;
    color:var(--ink-3);
  }
  .stat{display:flex; gap:14px; font-family:"IBM Plex Mono",ui-monospace,monospace; font-size:12px;
        color:var(--ink-2); font-variant-numeric:tabular-nums}
  .stat b{display:block; color:var(--ink); font-size:16px; font-weight:600}
  .find{display:flex; gap:6px}
  .find input{
    flex:1 1 auto; min-width:0; font:inherit; font-family:"IBM Plex Mono",ui-monospace,monospace;
    font-size:12.5px; padding:5px 8px; color:var(--ink);
    background:var(--paper); border:1px solid var(--line); border-radius:6px;
  }
  ol.picked{
    list-style:none; margin:0; padding:0; overflow-y:auto; flex:1 1 auto; min-height:120px;
    border-top:1px solid var(--line);
  }
  ol.picked li{
    display:flex; align-items:center; gap:8px; padding:5px 2px; border-bottom:1px solid var(--line);
    font-family:"IBM Plex Mono",ui-monospace,monospace; font-size:12px; font-variant-numeric:tabular-nums;
  }
  li .seq{
    flex:0 0 22px; height:22px; display:grid; place-items:center; border-radius:50%;
    background:var(--accent-soft); color:var(--accent); font-size:11px; font-weight:600;
  }
  li .id{font-weight:600; min-width:38px}
  li .xy{color:var(--ink-3)}
  li .gap{color:var(--warn); font-size:11px}
  li button{padding:1px 6px; font-size:12px; line-height:1.4; color:var(--ink-3)}
  li:hover{background:var(--surface-2)}
  .empty{color:var(--ink-3); font-size:12.5px; padding:10px 2px; line-height:1.6}
  .note{font-size:11.5px; color:var(--ink-3); line-height:1.55}
  .row{display:flex; gap:6px; flex-wrap:wrap}
  .row button{flex:1 1 auto}

  @media (max-width:780px){
    .main{flex-direction:column}
    .rail{flex:0 0 auto}
    .stage{min-height:52vh}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <header>
    <h1>Bộ chọn node track</h1>
    <span class="sub" id="meta"></span>
    <span class="spacer"></span>
    <div class="toolbar">
      <label class="chk"><input type="checkbox" id="ck-border" checked> biên</label>
      <label class="chk"><input type="checkbox" id="ck-divider" checked> vạch giữa</label>
      <label class="chk"><input type="checkbox" id="ck-lane" checked> tâm lane</label>
      <label class="chk"><input type="checkbox" id="ck-id"> số hiệu</label>
      <button id="btn-fit" class="ghost" title="Phím F">Vừa khung</button>
    </div>
  </header>

  <div class="main">
    <div class="stage">
      <canvas id="cv"></canvas>
      <div class="tip" id="tip"></div>
      <div class="readout" id="readout">x — , y —</div>
    </div>

    <aside class="rail">
      <h2>Node đã chọn</h2>
      <div class="stat">
        <span>node<b id="s-count">0</b></span>
        <span>chiều dài<b id="s-len">0.00 m</b></span>
        <span>đứt đoạn<b id="s-gap">0</b></span>
      </div>
      <div class="find">
        <input id="find" inputmode="numeric" placeholder="tìm theo id, vd 345" aria-label="Tìm node theo id">
        <button id="btn-find">Tới</button>
      </div>
      <ol class="picked" id="list"></ol>
      <div class="row">
        <button id="btn-copy" class="primary">Chép id</button>
        <button id="btn-copy-py">Chép list</button>
      </div>
      <div class="row">
        <button id="btn-undo">Bỏ cái cuối</button>
        <button id="btn-clear">Xoá hết</button>
      </div>
      <p class="note">Rê chuột để xem node, bấm để chọn, bấm lại để bỏ. Lăn chuột phóng to, kéo để di chuyển. “Chép id” cho ra mỗi dòng một id, đúng dạng <code>Grapher.loadPath</code> đọc.</p>
    </aside>
  </div>
</div>

<script>
(function(){
  "use strict";
  const DATA = JSON.parse(document.getElementById("map-data").textContent);

  // Toa do hien thi: lat ngang truc da xoay cho khop ban PNG
  const nodes = DATA.nodes.map(n => ({id:n.id, x:n.x, y:n.y, wx:-n.dx, wy:n.dy}));
  const byId = new Map(nodes.map(n => [n.id, n]));
  const flip = pts => pts.map(p => [-p[0], p[1]]);
  const layers = {
    border:  DATA.border.map(flip),
    divider: DATA.divider.map(flip),
    lane:    DATA.lanes.map(flip),
  };
  const YMAX = nodes[0].y - nodes[0].wx;          // wx = y - ymax  =>  y = wx + ymax
  const adj = new Set(DATA.edges.map(e => e[0] + ">" + e[1]));
  const out = new Map();
  for (const [u,v] of DATA.edges){ (out.get(u) || out.set(u,[]).get(u)).push(v); }

  document.getElementById("meta").textContent =
    nodes.length + " node · " + DATA.edges.length + " cạnh · lưới " +
    span(nodes.map(n=>n.x)).toFixed(1) + " × " + span(nodes.map(n=>n.y)).toFixed(1) + " m";
  function span(a){ return Math.max(...a) - Math.min(...a); }

  const cv = document.getElementById("cv"), ctx = cv.getContext("2d");
  const tip = document.getElementById("tip"), readout = document.getElementById("readout");
  let view = {s:60, tx:0, ty:0}, hover = null, picked = [], dpr = 1;

  const bounds = (() => {
    let a = {x0:Infinity, y0:Infinity, x1:-Infinity, y1:-Infinity};
    const eat = (x,y) => { a.x0=Math.min(a.x0,x); a.y0=Math.min(a.y0,y);
                           a.x1=Math.max(a.x1,x); a.y1=Math.max(a.y1,y); };
    nodes.forEach(n => eat(n.wx, n.wy));
    Object.values(layers).forEach(L => L.forEach(p => p.forEach(q => eat(q[0], q[1]))));
    return a;
  })();

  const toScreen = (x,y) => [x*view.s + view.tx, y*view.s + view.ty];
  const toWorld = (px,py) => [(px - view.tx)/view.s, (py - view.ty)/view.s];

  function fit(){
    const w = cv.clientWidth, h = cv.clientHeight;
    const bw = bounds.x1-bounds.x0, bh = bounds.y1-bounds.y0;
    view.s = Math.min(w/bw, h/bh) * 0.92;
    view.tx = (w - bw*view.s)/2 - bounds.x0*view.s;
    view.ty = (h - bh*view.s)/2 - bounds.y0*view.s;
    draw();
  }

  function resize(){
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    cv.width = Math.round(cv.clientWidth * dpr);
    cv.height = Math.round(cv.clientHeight * dpr);
    draw();
  }

  const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();

  function polys(list, color, width, dash){
    ctx.strokeStyle = color; ctx.lineWidth = width; ctx.setLineDash(dash || []);
    ctx.lineJoin = "round"; ctx.lineCap = "round";
    ctx.beginPath();
    for (const p of list){
      const s0 = toScreen(p[0][0], p[0][1]);
      ctx.moveTo(s0[0], s0[1]);
      for (let i=1;i<p.length;i++){ const s = toScreen(p[i][0], p[i][1]); ctx.lineTo(s[0], s[1]); }
    }
    ctx.stroke(); ctx.setLineDash([]);
  }

  function draw(){
    const w = cv.clientWidth, h = cv.clientHeight;
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.clearRect(0,0,w,h);

    if (document.getElementById("ck-lane").checked)
      polys(layers.lane, css("--lane"), 1, [5,5]);
    if (document.getElementById("ck-divider").checked)
      polys(layers.divider, css("--divider"), 1.6, [9,7]);
    if (document.getElementById("ck-border").checked)
      polys(layers.border, css("--road"), 1.8);

    // canh di ra tu node dang tro / dang chon cuoi cung
    const focus = hover || (picked.length ? byId.get(picked[picked.length-1]) : null);
    if (focus && out.has(focus.id)){
      ctx.strokeStyle = css("--accent"); ctx.lineWidth = 2.2; ctx.globalAlpha = .75;
      for (const v of out.get(focus.id)){
        const b = byId.get(v); if (!b) continue;
        const p = toScreen(focus.wx, focus.wy), q = toScreen(b.wx, b.wy);
        ctx.beginPath(); ctx.moveTo(p[0],p[1]); ctx.lineTo(q[0],q[1]); ctx.stroke();
        const a = Math.atan2(q[1]-p[1], q[0]-p[0]), L = 7;
        ctx.beginPath(); ctx.moveTo(q[0],q[1]);
        ctx.lineTo(q[0]-L*Math.cos(a-.4), q[1]-L*Math.sin(a-.4));
        ctx.lineTo(q[0]-L*Math.cos(a+.4), q[1]-L*Math.sin(a+.4));
        ctx.closePath(); ctx.fillStyle = css("--accent"); ctx.fill();
      }
      ctx.globalAlpha = 1;
    }

    // node
    const showId = document.getElementById("ck-id").checked;
    ctx.fillStyle = css("--ink-3");
    for (const n of nodes){
      const [sx, sy] = toScreen(n.wx, n.wy);
      if (sx < -20 || sy < -20 || sx > w+20 || sy > h+20) continue;
      ctx.beginPath(); ctx.arc(sx, sy, 2.1, 0, 7); ctx.fill();
    }
    if (showId && view.s > 42){
      ctx.fillStyle = css("--ink-2");
      ctx.font = '10px "IBM Plex Mono", ui-monospace, monospace';
      for (const n of nodes){
        const [sx, sy] = toScreen(n.wx, n.wy);
        if (sx < 0 || sy < 0 || sx > w || sy > h) continue;
        ctx.fillText(n.id, sx + 4, sy - 4);
      }
    }

    // node da chon: cham dam + so thu tu
    ctx.font = '600 10px "IBM Plex Mono", ui-monospace, monospace';
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    picked.forEach((id, i) => {
      const n = byId.get(id); if (!n) return;
      const [sx, sy] = toScreen(n.wx, n.wy);
      ctx.beginPath(); ctx.arc(sx, sy, 9, 0, 7);
      ctx.fillStyle = css("--accent"); ctx.fill();
      ctx.strokeStyle = css("--surface"); ctx.lineWidth = 1.5; ctx.stroke();
      ctx.fillStyle = "#fff"; ctx.fillText(String(i+1), sx, sy+.5);
    });
    ctx.textAlign = "start"; ctx.textBaseline = "alphabetic";

    if (hover){
      const [sx, sy] = toScreen(hover.wx, hover.wy);
      ctx.beginPath(); ctx.arc(sx, sy, 7, 0, 7);
      ctx.strokeStyle = css("--accent"); ctx.lineWidth = 2; ctx.stroke();
    }
  }

  function nearest(px, py){
    const [wx, wy] = toWorld(px, py);
    const rad = 16 / view.s;
    let best = null, bd = rad*rad;
    for (const n of nodes){
      const d = (n.wx-wx)**2 + (n.wy-wy)**2;
      if (d < bd){ bd = d; best = n; }
    }
    return best;
  }

  // ---- tuong tac ----
  let drag = null;
  cv.addEventListener("pointerdown", e => {
    cv.setPointerCapture(e.pointerId);
    drag = {x:e.offsetX, y:e.offsetY, tx:view.tx, ty:view.ty, moved:false};
  });
  cv.addEventListener("pointermove", e => {
    if (drag){
      const dx = e.offsetX-drag.x, dy = e.offsetY-drag.y;
      if (Math.abs(dx) + Math.abs(dy) > 3) drag.moved = true;
      view.tx = drag.tx + dx; view.ty = drag.ty + dy;
      draw();
    }
    const [wx, wy] = toWorld(e.offsetX, e.offsetY);
    readout.textContent = "x " + wy.toFixed(2) + " m ,  y " + (wx + YMAX).toFixed(2) + " m";
    const n = drag ? null : nearest(e.offsetX, e.offsetY);
    if (n !== hover){ hover = n; draw(); }
    if (hover){
      const nb = (out.get(hover.id) || []).join(", ") || "—";
      tip.innerHTML = "<b>node " + hover.id + "</b><br>x " + hover.x.toFixed(3) +
                      " · y " + hover.y.toFixed(3) + "<br><span class='dim'>đi tới: " + nb + "</span>";
      tip.style.display = "block";
      const r = tip.getBoundingClientRect();
      tip.style.left = Math.min(e.offsetX + 14, cv.clientWidth - r.width - 6) + "px";
      tip.style.top  = Math.max(e.offsetY - r.height - 12, 6) + "px";
    } else tip.style.display = "none";
  });
  cv.addEventListener("pointerup", e => {
    const wasDrag = drag && drag.moved; drag = null;
    if (wasDrag) return;
    const n = nearest(e.offsetX, e.offsetY);
    if (!n) return;
    const at = picked.indexOf(n.id);
    if (at >= 0) picked.splice(at, 1); else picked.push(n.id);
    sync();
  });
  cv.addEventListener("pointerleave", () => { hover = null; tip.style.display = "none"; draw(); });
  cv.addEventListener("wheel", e => {
    e.preventDefault();
    const k = Math.exp(-e.deltaY * 0.0014);
    const s2 = Math.max(6, Math.min(600, view.s * k));
    const [wx, wy] = toWorld(e.offsetX, e.offsetY);
    view.s = s2;
    view.tx = e.offsetX - wx*view.s; view.ty = e.offsetY - wy*view.s;
    draw();
  }, {passive:false});

  // ---- danh sach ----
  function pathLen(){
    let L = 0;
    for (let i=1;i<picked.length;i++){
      const a = byId.get(picked[i-1]), b = byId.get(picked[i]);
      if (a && b) L += Math.hypot(a.x-b.x, a.y-b.y);
    }
    return L;
  }
  function sync(){
    const list = document.getElementById("list");
    list.innerHTML = "";
    if (!picked.length){
      const li = document.createElement("li");
      li.className = "empty";
      li.textContent = "Chưa chọn node nào. Bấm vào một chấm trên bản đồ để bắt đầu; thứ tự bấm là thứ tự đường đi.";
      list.appendChild(li);
    }
    let gaps = 0;
    picked.forEach((id, i) => {
      const n = byId.get(id);
      const linked = i === 0 || adj.has(picked[i-1] + ">" + id);
      if (!linked) gaps++;
      const li = document.createElement("li");
      li.innerHTML = '<span class="seq">' + (i+1) + '</span>' +
        '<span class="id">' + id + '</span>' +
        '<span class="xy">' + n.x.toFixed(2) + ", " + n.y.toFixed(2) + '</span>' +
        (linked ? '' : '<span class="gap" title="không có cạnh nối từ node trước">⚠ đứt</span>');
      const del = document.createElement("button");
      del.className = "ghost"; del.textContent = "×"; del.title = "Bỏ node này";
      del.onclick = () => { picked.splice(i,1); sync(); };
      li.appendChild(document.createElement("span")).style.flex = "1 1 auto";
      li.appendChild(del);
      li.onmouseenter = () => { hover = n; draw(); };
      list.appendChild(li);
    });
    document.getElementById("s-count").textContent = picked.length;
    document.getElementById("s-len").textContent = pathLen().toFixed(2) + " m";
    document.getElementById("s-gap").textContent = gaps;
    draw();
  }

  async function copy(text, btn){
    try { await navigator.clipboard.writeText(text); }
    catch {
      const ta = document.createElement("textarea");
      ta.value = text; document.body.appendChild(ta); ta.select();
      document.execCommand("copy"); ta.remove();
    }
    const old = btn.textContent; btn.textContent = "Đã chép";
    setTimeout(() => btn.textContent = old, 1200);
  }

  document.getElementById("btn-copy").onclick = e => copy(picked.join("\n"), e.target);
  document.getElementById("btn-copy-py").onclick = e => copy("[" + picked.join(", ") + "]", e.target);
  document.getElementById("btn-undo").onclick = () => { picked.pop(); sync(); };
  document.getElementById("btn-clear").onclick = () => { picked = []; sync(); };
  document.getElementById("btn-fit").onclick = fit;
  for (const id of ["ck-border","ck-divider","ck-lane","ck-id"])
    document.getElementById(id).onchange = draw;

  function goto(){
    const id = document.getElementById("find").value.trim();
    const n = byId.get(id);
    if (!n){ document.getElementById("find").value = ""; return; }
    view.s = Math.max(view.s, 90);
    view.tx = cv.clientWidth/2 - n.wx*view.s;
    view.ty = cv.clientHeight/2 - n.wy*view.s;
    hover = n; draw();
  }
  document.getElementById("btn-find").onclick = goto;
  document.getElementById("find").addEventListener("keydown", e => { if (e.key === "Enter") goto(); });

  addEventListener("keydown", e => {
    if (e.target.tagName === "INPUT") return;
    if (e.key === "f" || e.key === "F") fit();
    if (e.key === "z" && (e.ctrlKey || e.metaKey)){ picked.pop(); sync(); }
    if (e.key === "Escape"){ hover = null; tip.style.display = "none"; draw(); }
  });

  new ResizeObserver(resize).observe(cv);
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
  resize(); fit(); sync();
})();
</script>
